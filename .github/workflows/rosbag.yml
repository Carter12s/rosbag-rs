name: rosbag

on:
  pull_request:
    paths-ignore:
      - README.md
  push:
    branches: master
    paths-ignore:
      - README.md

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.63.0 # MSRV
          components: clippy
          override: true
          profile: minimal
      # Pin dependencies for MSRV compatibility (Rust 1.63)
      # Order matters: pin high-level crates before their transitive dependencies
      - name: Pin MSRV-compatible dependency versions
        run: |
          cargo update -p log --precise 0.4.21
          cargo update -p bzip2-sys --precise 0.1.11+1.0.8
          cargo update -p tempfile --precise 3.10.1
          cargo update -p backtrace --precise 0.3.67
          cargo update -p serde --precise 1.0.197
          cargo update -p serde_derive --precise 1.0.197
          cargo update -p syn --precise 2.0.52
          cargo update -p quote --precise 1.0.35
          cargo update -p proc-macro2 --precise 1.0.78
          cargo update -p unicode-ident --precise 1.0.12
      - run: cargo clippy --all -- -D warnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v1

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          override: true
          profile: minimal

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal
      - run: cargo update -Z minimal-versions
      # Only run library tests - integration tests have dev-dependencies
      # that may not properly specify their minimum versions
      - run: cargo test --lib

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.63.0 # MSRV
          - stable
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      # Pin dependencies for MSRV compatibility (Rust 1.63)
      # Order matters: pin high-level crates before their transitive dependencies
      - name: Pin MSRV-compatible dependency versions
        if: matrix.rust == '1.63.0'
        run: |
          cargo update -p log --precise 0.4.21
          cargo update -p bzip2-sys --precise 0.1.11+1.0.8
          cargo update -p tempfile --precise 3.10.1
          cargo update -p backtrace --precise 0.3.67
          cargo update -p serde --precise 1.0.197
          cargo update -p serde_derive --precise 1.0.197
          cargo update -p syn --precise 2.0.52
          cargo update -p quote --precise 1.0.35
          cargo update -p proc-macro2 --precise 1.0.78
          cargo update -p unicode-ident --precise 1.0.12
      - run: cargo test
      - run: cargo test --all-features

  ros-compat:
    name: ROS1 Noetic Compatibility
    runs-on: ubuntu-latest
    container:
      image: carter12s/roslibrust-ci-noetic:rust_1_90
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Run all tests (including ROS compatibility)
        run: source /opt/ros/noetic/setup.bash; source /root/.cargo/env; cargo test --all-features -- --ignored
        shell: bash